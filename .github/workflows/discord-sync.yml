name: 디스코드 동기화

# ── 주기 ────────────────────────────────────────────────────
# Vercel 무료 플랜의 Cron 은 하루 1회만 돌 수 있어서 스케줄러를 Actions 로 돌린다.
# Actions 무료 사용량은 저장소 공개 여부에 따라 다르다.
#   · 공개 저장소 : 무제한  → 5분 주기(*/5) 가능
#   · 비공개 저장소 : 월 2,000분 → '*/30' 으로 내리거나, 이 파일만 별도 공개 저장소로 옮긴다
# 이 저장소는 공개이므로 5분 주기를 쓴다.
#
# ── 필요한 설정 ─────────────────────────────────────────────
# 저장소 Settings → Secrets and variables → Actions
#   Variables 탭 → SITE_URL      = https://<배포주소>   (비밀이 아니므로 Variables 권장)
#   Secrets   탭 → SYNC_SECRET   = Vercel 에 넣은 것과 같은 값
# SITE_URL 을 Secrets 에 넣어도 동작한다 (아래에서 둘 다 본다).
# ────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 설정 확인
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          fail=0
          if [ -z "${SITE_URL}" ]; then
            echo "::error::SITE_URL 이 비어 있습니다. Settings → Secrets and variables → Actions → Variables 에 SITE_URL 을 추가하세요 (예: https://square-village-homepage.vercel.app)"
            fail=1
          else
            case "${SITE_URL}" in
              https://*|http://*) ;;
              *) echo "::error::SITE_URL 이 https:// 로 시작하지 않습니다. 도메인만 넣지 말고 https:// 를 붙여 주세요"; fail=1 ;;
            esac
          fi
          if [ -z "${SYNC_SECRET}" ]; then
            echo "::error::SYNC_SECRET 이 비어 있습니다. Settings → Secrets and variables → Actions → Secrets 에 추가하세요 (Vercel 의 SYNC_SECRET 과 같은 값)"
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1
          echo "설정 확인 완료"

      - name: 동기화 호출
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          url="${SITE_URL%/}/api/sync/discord"
          code=$(curl -sS -o body.txt -w '%{http_code}' \
            -X POST "$url" \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            --max-time 120 || echo 000)
          echo "HTTP $code"
          cat body.txt 2>/dev/null || true
          echo
          case "$code" in
            200) echo "동기화 완료" ;;
            401) echo "::error::인증 실패 — SYNC_SECRET 이 Vercel 값과 다릅니다"; exit 1 ;;
            404) echo "::error::엔드포인트를 찾지 못했습니다 — SITE_URL 이 맞는지, 배포가 되어 있는지 확인하세요"; exit 1 ;;
            000) echo "::error::서버에 연결하지 못했습니다 — SITE_URL 주소를 확인하세요"; exit 1 ;;
            *)   echo "::error::동기화 실패 (HTTP $code)"; exit 1 ;;
          esac
