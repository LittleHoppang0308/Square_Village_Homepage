name: 디스코드 동기화

# ── 주기를 30분으로 잡은 이유 ────────────────────────────────
# Vercel 무료 플랜의 Cron 은 하루 1회만 돌 수 있어서 스케줄러를 Actions 로 돌린다.
# 그런데 Actions 무료 사용량은 저장소 공개 여부에 따라 다르다.
#   · 공개 저장소 : 무제한  → 5분 주기(*/5)로 올려도 된다
#   · 비공개 저장소 : 월 2,000분  → 5분 주기면 하루 288회, 월 8,640회.
#     실행 한 건이 몇 초로 끝나도 한도를 넘거나 위험하게 붙는다.
# 이 저장소는 공개이므로 5분 주기(*/5)를 쓴다.
# ★ 저장소를 비공개로 되돌리면 이 주기가 월 2,000분 한도를 넘는다.
#   그때는 '*/30' 으로 내리거나, 이 파일만 별도 공개 저장소로 옮긴다.
# ────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 동기화 호출
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          set -u
          code=$(curl -sS -o body.txt -w '%{http_code}' \
            -X POST "${SITE_URL%/}/api/sync/discord" \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            --max-time 120 || echo 000)
          echo "HTTP $code"
          cat body.txt || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::동기화 실패 (HTTP $code)"
            exit 1
          fi
